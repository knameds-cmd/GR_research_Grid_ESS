      low: {value: 89.06, currency: GBP, year: 2025, status: derived, source: "central × 0.711 (위와 같음)"}
      high: {value: 262.98, currency: USD, year: 2023, status: derived, source: "PNNL24 100 MW 8h 2030 Point: SB 133.33 + SBOS 27.14 + 통합 32.04 + EPC 32.08 + 개발 38.39 $/kWh. 합계 8h $2,177/kW = 9491행 총액과 일치"}
    devex_grid:
      central: {value: 40.0, currency: GBP, year: 2012, status: sourced, source: "MM18 Li-ion PL-DA 200 MW: 개발비 £1.18m + 계통 접속(Medium) £6.82m = £8.0m ÷ 200 MW (p59/51). FES capex에 빠진 몫"}
      high: {value: 0.0, currency: USD, year: 2023, status: sourced, source: "PNNL capex에 개발비·계통 통합 포함 (PNNL22 p30/8, p31/9)"}
    fixed_om_power:
      central: {value: 9.44, currency: GBP, year: 2025, status: derived, source: "FES25 E.03 fixed opex 4h 12.4, 9h 16.1 £/kW·년 → 에너지 0.74/kWh, 출력 12.4 − 4×0.74"}
      high: {value: 0.88, currency: USD, year: 2023, status: derived, source: "PNNL24 2030 고정 운영비 8h 6.48, 24h 17.68 $/kW·년(9478·9622행) → 에너지 0.70/kWh, 출력 6.48 − 8×0.70. 전력 설비 10년마다 30% 정비 포함(PNNL22 p39/17), 셀 보강 제외"}
    fixed_om_energy:
      central: {value: 0.74, currency: GBP, year: 2025, status: derived, source: "위 FES25 분해"}
