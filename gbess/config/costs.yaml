    var_om: {central: 0.0, currency: GBP, year: 2025, status: sourced, source: "FES25·Cole25(p18/11)·PNNL22(p31/9) 모두 0"}
    life_years: {central: 25, status: sourced, source: "Ofgem 경제 수명 Li-ion 25년 (MTD 5.18 p24). 자료의 기술 수명은 15년(ATB25, Cole25, FES25)~16년 달력 수명(PNNL22 p41/19)이라, 25년은 보강을 전제한다"}
    build_years: {central: 1, status: sourced, source: "PNNL22 Table 6.2 p144/122, ATB25 41행, AFRY22, FES25 E.02 모두 1년"}
    idc_rate: {central: 0.0447, status: placeholder, source: "건설 중 이자율. floor 수익률(BBB 15년+ 실질)을 임시로 씀. Ofgem은 벤치마크로 정한다(TDD p57)"}
