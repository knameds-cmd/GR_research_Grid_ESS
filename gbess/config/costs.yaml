# 기술·비용 입력 (11 문서 #6, 09 문서 4.5). 계산: gbess/finance/costs.py. 출처 정리: literature/sources/tech/TECH_SOURCES.md
#
# 값은 자료의 원래 통화·연도 그대로 적고(currency, year), 코드가 2025년 실질 £(CPIH)로 바꾼다.
# 경우(case): central = 영국 정부·NESO 가정(있을 때), low·high = 다른 1차 자료나 같은 자료의 범위. 값마다 경우별로
#   통화·연도가 다를 수 있어, 경우 값이 {value, currency, year, source}면 그 경우만 따로 환산한다.
# status: sourced = 1차 자료에서 읽음 / derived = 1차 자료 값으로 계산(식은 source에) / placeholder = 확인 전 임시값.
# 단위: capex_power = 원/kW, capex_energy = 원/kWh(정격 출력 × 지속시간 기준), fixed_om_power = 원/kW·년,
#   fixed_om_energy = 원/kWh·년, var_om = 원/MWh 방전, devex_grid = 원/kW(개발비 + 계통 접속, 자료 capex에 빠져 있을 때만).
# 공통 주의
#   - Mott MacDonald 2018과 그것을 이어받은 AFRY 2022·FES 2025의 capex는 EPC 계약 이후 비용이라 개발비와 계통 접속을
#     따로 더한다(MM p46/38). PNNL capex에는 개발비와 계통 접속이 들어 있다(PNNL 2022 p30/8, p31/9). 그래서 devex_grid는
#     경우마다 다르다.
#   - 2030년 값을 쓴다(Window 1 사업의 첫 운전 2029~2033, MTD Table 6).
#   - 자료 약칭: PNNL22 = PNNL-33283(2022), PNNL24 = PNNL ESGC 데이터베이스 v2024(시트 Database, 행 번호),
#     ATB25 = NREL ATB 2025 workbook, Cole25 = NREL/TP-6A40-93281, MM18 = Mott MacDonald for BEIS 2018(2012년 가격),
#     AFRY22 = BEIS Research Paper 2022/019 Exhibit 3.11(2019년 실질 £), FES25 = NESO FES 2025 Economics Inputs E.03
#     (2025년 가격), LCP24 = DESNZ Research Paper 2023/047 Table 7(2022년 실질 £), MTD = Ofgem Window 1 minded-to(2026-06).

assets:   # 대표 자산. 크기·지속시간은 Window 1 Table 6 (technologies.yaml과 같음)
  li_ion_8h: {tech: li_ion, p_mw: 400, duration_h: 8}
  li_ion_16h: {tech: li_ion, p_mw: 400, duration_h: 16}
  psh: {tech: psh, p_mw: 1440, duration_h: 22.3}
  caes: {tech: caes, p_mw: 50, duration_h: 30}
  flow: {tech: flow, p_mw: 50, duration_h: 8}

technologies:

  li_ion:   # LFP. 8·16시간 모두 같은 출력·에너지 단가 분해를 쓴다(PNNL24 8h·24h 총액이 이 분해와 2% 안에서 맞음)
    capex_power:
      central: {value: 152.96, currency: GBP, year: 2025, status: derived, source: "FES25 E.03 2030 Battery 4h £654.0/kW, 9h £1,280.3/kW → 에너지 (1280.3−654.0)/5 = £125.26/kWh, 출력 654.0 − 4×125.26 = £152.96/kW. FES 배터리 capex의 원자료는 Modo(비공개)"}
      low: {value: 108.76, currency: GBP, year: 2025, status: derived, source: "central × 0.711 = ATB25 8h 2030 OCC Advanced 1,300.3 ÷ Moderate 1,828.4 $/kW (Utility-Scale Battery - R&D, 113·114행)"}
      high: {value: 73.60, currency: USD, year: 2023, status: derived, source: "PNNL24 100 MW 8h 2030 Point: 전력 설비 55.77 + 제어 0.96 + 계통 통합 16.87 $/kW (9470~9477행)"}
    capex_energy:
