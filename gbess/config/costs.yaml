    ref_cycles_per_year: {central: 250, status: placeholder, source: "보강 계산용 연 등가 완전 사이클. 엔진 결과로 바꿔 넣을 것(project_costs의 cycles_per_year)"}
    energy_cost_trend:
      central: {value: -0.022, status: derived, source: "Cole25 Table 2 중간 경로 4h 2030 $279 → 2050 $178/kWh: (178/279)^(1/20) − 1 (p23/16)"}
