    augmentation_years: {central: 1, status: placeholder, source: "매년 보강으로 단순화. 실제는 몇 년마다 보강 + 처음 과설비(PNNL22 p148/126). 보강 간격은 총비용을 조금만 바꾼다"}
    augmentation_cost:
      central: {value: 63.5, currency: GBP, year: 2025, status: derived, source: "보강은 셀(SB) 단가로 산다(PNNL22 p148/126). FES25 에너지 단가 125.26 × PNNL24 2030 SB 몫(133.33 ÷ 262.98 = 0.507)"}
      low: {value: 45.2, currency: GBP, year: 2025, status: derived, source: "low 에너지 단가 89.06 × 0.507"}
      high: {value: 133.33, currency: USD, year: 2023, status: sourced, source: "PNNL24 100 MW 8h 2030 Point DC SB $/kWh (9470행)"}
