  - {date: "2026-11-05", change: "연구자 승인 (status approved, V5 창 2026-11-06~2027-05-05, 태그 prereg-m1)", by: "연구자"}
  - {date: "2026-11-05", change: "T3·T4 빈칸 채움: zones = 3구역(N/S/EW), boundary_limit_2030 = B4 3,940 / B6 5,740 MW(관측 감산 계수), interconnectors = excluded, marginal_costs.thermal = fleet_2030.yaml, redispatch.infeasible_fixed = min_deviation(spec에 없던 경우의 처리). 지표·설계안·통과 기준·go/no-go 규칙은 바꾸지 않음", by: "연구자 위임(근거가 확실한 범위에서 Claude 추천값 적용), Claude Code 기록"}
  - {date: "2026-11-05", change: "M1 규칙 결과 조건부 → 연구자가 A(spec 조건부 절차) 선택. 정의가 없던 redispatch.sequential과 conditional_windy_year(2020)를 채움. 지표·설계안·통과 기준·규칙은 바꾸지 않음", by: "연구자 위임, Claude Code 기록"}
  - {date: "2026-11-05", change: "연구자 판정: M2로 진행. M2 검증에서 spec에 없던 세부를 채움(지표·통과 기준·규칙은 그대로). V3: 순환한 날 = 그날 PN 양수·발전 모두 유닛 정격 × 1시간 이상, 가격차 = 그날 MID 1시간 상위 k − 하위 k 평균(주 k = 4, 민감도 k = 8), 대상 Dinorwig·Ffestiniog·Cruachan 유닛(Foyers 제외), 유닛·날을 모은 로짓, 날 단위 블록 붓스트랩 1,000회 90% 구간 (gbess.system.observed). V1 관측은 1시간 평균(data_rules.aggregation) 기준이라 B4·B6 큰 쪽 초과량 7.37 TWh(30분 합 7.42). 2025 재현 입력: FES 2025 BB HT 2025 열, CP.01 2025 연료·탄소, E.01 2025 배터리 지속시간, NESO 2025 수요(실제 소비)·인터커넥터 조류(고정 주입), FUELHH 원자력·수력 실측 가용률, ERA5 2025(NSF NCAR 미러, Zenodo 2020-01과 대조 일치) 풍력, NESO 배전망 태양광 실측 이용률, 관측 한도 결측은 그달 중앙값 (gbess.system.backcast). V3 결과를 본 뒤 정의를 바꾸지 않음", by: "연구자 위임, Claude Code 기록"}
  - {date: "2026-11-05", change: "연구자 결정: V1이 보정 없이 떨어져(초과량 1.69배) 원인 점검 뒤 선택지 ② = 한도 배율 보정 대신 근거를 찾은 두 입력 수정을 주 모형(2025 재현, 2030 M1)에 넣음. (6) 수요 모양: 배전망 풍력의 스코틀랜드 몫 0.445(DESNZ 2025 지역 통계·TEC 등록부로 0.36~0.53의 가운데), 태양광 0.045. (1') 스코틀랜드 육상 이용률 × 0.895(DESNZ 22.0 TWh + REF 감축 3.95 TWh, 평균 설비 10,421 MW 기준). 해상은 바꾸지 않음. 이 수정은 V1을 본 뒤라 V1은 표본 안 결과로 표시하고 진짜 검증은 V5. 지표·설계안·통과 기준·go/no-go 규칙은 바꾸지 않음. conditional_windy_year.demand_shape의 'EW/ND 비율로 나눔'은 이 수정으로 바뀜 (docs/notes/m2_validation_KO.md 7장)", by: "연구자 결정, Claude Code 기록"}
  - {date: "2026-11-06", change: "입력 수정 ② 뒤 M1 전체 다시 계산(results/system/m1). 2013 규칙 결과 조건부 그대로, 조건부 no-go 조건(D_seq < M) 여섯 판 모두 불성립 그대로, 2020년만의 M1 규칙 결과는 조건부 → no-go(×0.8 D_lo 21.7, ×1.0 19.0). 연구자 판정: M2 계속 진행, 2020년 결과는 결론에 범위와 한계로 보고. 지표·설계안·통과 기준·규칙은 바꾸지 않음", by: "연구자 판정, Claude Code 기록"}
  - {date: "2026-11-06", change: "V5 절차를 창의 관측 조류를 보기 전에 정함 (spec에 없던 세부, 지표·통과 기준은 그대로; gbess.system.holdout). 얼린 모형 = 입력 수정 ② 뒤의 주 모형(2025 재현과 같은 방법). 창 = UTC 2026-11-06 00시 ~ 2027-05-06 00시 전. 관측 입력: ERA5(NSF NCAR 미러) 풍력, NESO Historic Demand Data(수요·배전망 풍력·태양광·인터커넥터 조류 고정 주입), FUELHH 원자력·수력 가용률, NESO 하루 전 한도(결측은 그달 중앙값). FES 2025에서 미리 정한 것: BB HT 설비, CP.01 연료·탄소, E.01 배터리 지속시간 비율, 열은 창 가운데 날짜 바로 앞 연말(본 판 2026: 가스 £27.72/MWh, 경유 £11.14/GJ, 바이오매스 3.6 p/kWh, 탄소 £87.33/t, 배터리 1h 9.844 / 2h 4.629 / 4h+ 0.117 GW). W1 사업 없음. 1단계만 풀어 B6·B4 제약 발생 비율(±0.10)과 B4·B6 큰 쪽 초과량 비율(0.65~1.35)을 판정. 관측도 V1과 같은 정의(1시간 평균, flow ≥ limit, 관측이 있는 시간만). 비교 기준: 지난해 같은 창(2025-11-06~2026-05-06)의 관측값을 그대로 쓴 단순 예측의 오차(보고만, 04 보고서 V5). 창이 끝나기 전에는 2026-10-25 이후 하루 전 조류를 코드에서 읽지 못하게 막음(holdout.guard). 연습 판(2025-11-06~2026-05-06, FES 2025 열)은 코드 시험용이고, 그 결과로 모형을 바꾸지 않음(코드 오류만 고치고 기록). 경계 이름(SCOTEX, SSE_SP2)이 창 안에서 바뀌면 그때 연구자에게 물음", by: "연구자 위임, Claude Code 기록"}
  - {date: "2026-11-06", change: "연구자 결정: 인터커넥터 가격 수용 민감도(보고만, 판정 규칙에 쓰지 않음)는 선택지 A. 기상연도 2020만(Ember 시간별 하루 전 가격이 2015년부터라 2013은 불가). 해외 가격 = Ember 2020 FR·BE·NL·NO·DK·IE·DE(나라 평균, CC-BY-4.0) × k, k = 2030 CCGT 연료+탄소 비용 £84.39 ÷ 2020 CCGT 연료+탄소 비용 €29.35 = 2.875 (효율 0.53, 0.203 t/MWh; 2020 가스 IMF EU $3.178/MMBtu, 1.141 $/€, NCV/GCV 0.90; 2020 탄소 UBA 독일 경매 평균 €24.61/t; placeholder). 링크 2030 = FES BB Gen_BB022 HT 11,700 MW: 2025 운전 9,800 MW + Moyle 500 + 증가분 1,400 MW를 NeuConnect(독일)로 둠(derived). 링크는 비용 = 해외 가격 × 출력(수입 +, 수출 −)인 발전원으로 1단계·재급전·계획자 모두에서 조정 가능. 판: S0, 한도 ×0.8·×1.0·×1.2, 순차 재급전 포함 (gbess.system.interconnectors)", by: "연구자 결정, Claude Code 기록"}
  - {date: "2026-11-06", change: "연구자 판정: V2b는 주 기준(B6 = SCOTEX)으로 판정해 '떨어짐'(몫 0.686 < 0.70, 배수 2.11). spec 처리대로 변형 (ii)를 현실 근사로 쓰지 않고 범위 끝값으로만 보고. 보조 기준(B4 또는 B6) 통과(0.709, 1.60)는 함께 적음. V3는 규칙 결과 '실패'를 그대로 두고, spec에 실패 때 처리가 없으므로 판정 불가 때 처리('S1a·S1b의 행동 반응은 검증되지 않은 가정이라고 밝힘')를 적용. V5 얼린 모형(커밋 5435688)에 git 태그 prereg-v5. 지표·설계안·통과 기준·규칙은 바꾸지 않음", by: "연구자 판정, Claude Code 기록"}
  - {date: "2026-11-06", change: "연구자 승인: M3를 단계로 나눠 M3a만 먼저 사전등록(scenarios_m3.m3a). 2030, 기상연도 2010~2024 15개 해(새로 13개), 판 = 모든 해 S0·S1a·S1b ×1.0 + S0 ×0.8·×1.2 + 순차 재급전 S0 ×1.0. 2001~2009·2025(M3a+)는 태양광 변환 코드가 필요해 다음 단계. M3c는 cap-and-floor 면허 원문 확인을 먼저 함(M1에서 W1 16건 모두 수익이 floor 아래라 floor 아래 운전 가정이 결과를 정함). 지표·설계안·통과 기준·M1 규칙은 바꾸지 않음", by: "연구자 승인, Claude Code 기록"}
  - {date: "2026-11-06", change: "M3a에서 spec에 없던 세부(결과 전에 정함, gbess.system.m3a): 설계안 순위는 해마다 S0·S1a·S1b의 계통 총비용과 소비자 지급을 재급전 (iii) D_lo 판(한도 ×1.0)에서 비교, 차이 £0.1m 미만은 같은 순위. '순위 유지' = 2013년(M1 주 결과, Ofgem 기준 기상연도)의 순위와 같음. 풍력 이용률 = 2030 육상·해상 설비로 가중한 그해 모형 입력 이용률. D_seq의 W1 북쪽 몫 = with_W1N − without_W1N (M1과 같음)", by: "연구자 위임, Claude Code 기록"}
